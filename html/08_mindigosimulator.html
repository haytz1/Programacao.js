<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mingigos</title>
</head>
<body style="background-color: red; color: white; " >

    <a  href="./09_painel.html">Ir pro painel</a>
    
    <h1>Mindigos esfomeados</h1>
    <p>Voce tem 🤮<strong id="textodinheiro" >0</strong> lixo</p>

    <img onclick="venderLixo()" src="https://pbs.twimg.com/media/Gj7ZqcbXAAA3ecv.jpg" style="height: 250px; cursor: pointer; "  />

    <ul>
        <li>Caçamba de lixo - <strong id="textocacamba" >25</strong> <button onclick="cacambaLixo()" >Comprar 🤮 </button> </li>
        <li>Caminhao de lixo - <strong id="textocaminhao" >1000</strong> <button onclick="caminhaoLixo()" >Comprar 🤮 </button></li>
        <li>jatinho de lixo - <strong id="textojatinho">50000</strong><button onclick="jatinhoLixo()" >Comprar 🤮 </button></li>
    </ul>

    <p>Faça login para ser promovido ao um mendingo luxuoso<button onclick="mendingoluxoso()" >Clique aqui</button></p>

    <script>

        let dinheiro = Number(localStorage.getItem("dinheiro")) || 0
        let dinheiroPorClique = Number(localStorage.getItem("dinheiroPorClique")) || 1
        let cacambapreco = Number(localStorage.getItem("cacambapreco")) || 25
        let caminhaopreco = Number(localStorage.getItem("caminhaopreco")) || 1000
        let jatinhopreco = Number(localStorage.getItem("jatinhopreco")) || 50000

        function salvarjogo(){
            localStorage.setItem("dinheiro", dinheiro)
            localStorage.setItem("dinheiroPorClique", dinheiroPorClique)
            localStorage.setItem("cacambapreco", cacambapreco)
            localStorage.setItem("caminhaopreco", caminhaopreco)
            localStorage.setItem("jatinhopreco", jatinhoLixo)
        }

        function venderLixo(){
            dinheiro += dinheiroPorClique
            document.getElementById("textodinheiro").innerHTML = dinheiro
            salvarjogo()
        }

        function cacambaLixo (){

            if (dinheiro < cacambapreco ){
                alert("Dinheiro insuficiente sai daqui mindigo")
            } else {
                dinheiroPorClique += 1
                dinheiro -= cacambapreco
                document.getElementById("textodinheiro").innerHTML = dinheiro
                cacambapreco += parseInt(cacambapreco * 0.2)
                document.getElementById("textocacamba").innerHTML = cacambapreco

                salvarjogo()
            }
        }

        function caminhaoLixo (){

             if (dinheiro < caminhaopreco ){
                alert("Dinheiro insuficiente sai daqui mindigo")
            } else {
                dinheiroPorClique += 10
                dinheiro -= caminhaopreco
                document.getElementById("textodinheiro").innerHTML = dinheiro
                caminhaopreco += parseInt(caminhaopreco * 0.2)
                document.getElementById("textocaminhao").innerHTML = caminhaopreco

                salvarjogo()
            }
        }

        function jatinhoLixo (){

            if (dinheiro < jatinhopreco ){
                alert("Dinheiro insuficiente sai daqui mindigo")
            } else {
                dinheiroPorClique += 100
                dinheiro -= jatinhopreco
                document.getElementById("textodinheiro").innerHTML = dinheiro
                jatinhopreco += parseInt(jatinhopreco * 0.2)
                document.getElementById("textojatinho").innerHTML = jatinhopreco

                salvarjogo()
            }
        }

        function mendingoluxoso(){

            if (localStorage.getItem("recompensaResgatada") == "1") {
                alert("Você já resgatou essa recompensa! 🤑")
                return
            }

            if( localStorage.getItem("logado") == 1 ){
                alert("Voce evoluiu para mindigo luxoso parabens 🤑🤑")
                dinheiro += 200
                document.getElementById("textodinheiro").innerHTML = dinheiro
                localStorage.setItem("recompensaResgatada", "1")

            } else {
                alert("Voce ainda nao evoluiu para mindigo luxuoso")
            }

        }
        

        //Nao permitri regastar 2x a recompensa
        //nao pode romver o autenticado
        // salva o dinheiro automatico no localstorage
        // ao atualizar sair ou fechar o dinheiro fica salvo

    </script>

</body>
</html>
